name: CI All

on:
  push:
    branches:
      - master
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/ci-build-windows.yml

  build-linux:
    uses: ./.github/workflows/ci-build-linux.yml

  build-macos:
    uses: ./.github/workflows/ci-build-macos.yml

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build sdist
        run: python3 VapourSynth/ci/build-sdist.py --out-dir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to vs-wheels
    needs:
      - build-windows
      - build-linux
      - build-macos
      - build-sdist
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_release_token: ${{ steps.token-check.outputs.present }}
      should_publish: ${{ steps.publish-policy.outputs.publish }}

    steps:
      - name: Check release token
        id: token-check
        env:
          RELEASE_TOKEN: ${{ secrets.VS_WHEELS_RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download distributions
        if: steps.token-check.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Determine version
        if: steps.token-check.outputs.present == 'true'
        id: version
        run: |
          VERSION=$(python3 VapourSynth/ci/version.py)
          TAG="vapoursynth-lsmas-v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decide publish policy
        if: steps.token-check.outputs.present == 'true'
        id: publish-policy
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            *.dev*)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload to GitHub Release
        if: steps.publish-policy.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: Jaded-Encoding-Thaumaturgy/vs-wheels
          token: ${{ secrets.VS_WHEELS_RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: vapoursynth-lsmas ${{ steps.version.outputs.version }}
          files: dist/*
          body: vapoursynth-lsmas ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          generate_release_notes: false

  trigger-index:
    name: Trigger vs-wheels index
    needs: publish
    if: needs.publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.VS_WHEELS_RELEASE_TOKEN }}
          repository: Jaded-Encoding-Thaumaturgy/vs-wheels
          event-type: index
