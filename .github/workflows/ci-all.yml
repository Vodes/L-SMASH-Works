name: CI All

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/ci-build-windows.yml

  build-linux:
    uses: ./.github/workflows/ci-build-linux.yml

  build-macos:
    uses: ./.github/workflows/ci-build-macos.yml

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          VERSION=$(python3 VapourSynth/ci/version.py)
          TAG="vapoursynth-lsmas-v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build sdist
        run: python3 VapourSynth/ci/build-sdist.py --out-dir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to vs-wheels
    needs:
      - build-windows
      - build-linux
      - build-macos
      - build-sdist
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      has_release_token: ${{ steps.token-check.outputs.present }}
      should_publish: ${{ steps.publish-policy.outputs.publish }}

    steps:
      - name: Check release token
        id: token-check
        env:
          RELEASE_TOKEN: ${{ secrets.VS_WHEELS_RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download distributions
        if: steps.token-check.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Determine version
        if: steps.token-check.outputs.present == 'true'
        id: version
        env:
          VERSION: ${{ needs.build-sdist.outputs.version }}
          TAG: ${{ needs.build-sdist.outputs.tag }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decide publish policy
        if: steps.token-check.outputs.present == 'true'
        id: publish-policy
        env:
          VERSION: ${{ needs.build-sdist.outputs.version }}
        run: |
          case "$VERSION" in
            *.dev*)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Publish to pypi
        if: steps.publish-policy.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
